{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div id="chat-log" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px;"></div>
    
    <form id="send-form" class="mt-3">
        <input type="text" id="msg-input" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>
</div>

<script>
    const otherId = "{{ other_user_id }}";
    const chatLog = document.getElementById('chat-log');

    // 1. மெசேஜ் பெறுதல் (Receive/Get)
    async function getMessages() {
        const response = await fetch(`/messaging/data/${otherId}/`);
        const data = await response.json();
        
        chatLog.innerHTML = data.messages.map(m => `
            <div><b>${m.sender_id == data.current_id ? 'You' : 'Other'}:</b> ${m.body} (${m.time})</div>
        `).join('');
    }

    // 2. மெசேஜ் அனுப்புதல் (Send)
    document.getElementById('send-form').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('msg-input');
        
        const formData = new FormData();
        formData.append('receiver_id', otherId);
        formData.append('body', input.value);
        // CSRF Token தேவைப்படும்போது 'X-CSRFToken' சேர்க்கவும்

        await fetch('/messaging/send/', {
            method: 'POST',
            body: new URLSearchParams(formData)
        });
        
        input.value = '';
        getMessages(); // அனுப்பியதும் உடனே மெசேஜைப் புதுப்பிக்க
    };

    // ஒவ்வொரு 2 வினாடிக்கும் மெசேஜைப் புதுப்பிக்க
    setInterval(getMessages, 2000);
</script>
{% endblock %}
