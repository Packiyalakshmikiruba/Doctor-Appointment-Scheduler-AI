{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h3>Voice Booking</h3>
  <p class="text-muted">Speak or type your booking request below.</p>

  <div id="voice-status" class="mb-2 text-muted"></div>
  <textarea id="transcript-box" class="form-control mb-2" rows="3" placeholder="Your request will appear here, or type it directly..."></textarea>

  <button id="mic-btn" class="btn btn-outline-primary">🎤 Start Speaking</button>
  <button id="send-btn" class="btn btn-primary">Send</button>

  <div id="response-box" class="mt-3 p-3 border rounded bg-light" style="display:none;"></div>
</div>

<script>
const micBtn = document.getElementById('mic-btn');
const sendBtn = document.getElementById('send-btn');
const transcriptBox = document.getElementById('transcript-box');
const statusEl = document.getElementById('voice-status');
const responseBox = document.getElementById('response-box');

let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.onresult = (e) => {
    transcriptBox.value = e.results[0][0].transcript;
    statusEl.textContent = '';
  };
  recognition.onerror = () => { statusEl.textContent = 'Could not capture audio. Please type instead.'; };
} else {
  micBtn.disabled = true;
  statusEl.textContent = 'Voice input not supported in this browser — please type your request.';
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  statusEl.textContent = 'Listening...';
  recognition.start();
});

sendBtn.addEventListener('click', async () => {
  const transcript = transcriptBox.value.trim();
  if (!transcript) return;

  responseBox.style.display = 'block';
  responseBox.textContent = 'Processing...';

  try {
    const res = await fetch('/api/voice-booking/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript })
    });
    const data = await res.json();
    responseBox.textContent = data.response || data.error || 'No response received.';
  } catch (err) {
    responseBox.textContent = 'Network error. Please try again.';
  }
});
</script>
{% endblock %}
