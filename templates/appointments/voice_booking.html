{% extends "base.html" %}
{% block title %}Voice Appointment Assistant{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0"><i class="bi bi-mic-fill"></i> Voice Assistant</h4>
                <small>Book appointments, check doctors, or ask questions -- by voice</small>
            </div>

            <div class="card-body text-center p-4">

                <p class="text-muted">Tap the mic and say something like:</p>
                <p class="fst-italic text-secondary">"I have fever, book an appointment"</p>

                <button id="mic-btn" class="btn btn-lg btn-primary rounded-circle p-4 mb-3">
                    <i class="bi bi-mic-fill fs-2"></i>
                </button>

                <div id="status-text" class="text-muted mb-3">Tap to speak</div>

                <div id="transcript-box" class="alert alert-light border d-none text-start">
                    <strong>You said:</strong> <span id="transcript-text"></span>
                </div>

                <div id="response-box" class="alert d-none text-start"></div>

            </div>
        </div>

    </div>
</div>

<script>
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
}

const micBtn = document.getElementById("mic-btn");
const statusText = document.getElementById("status-text");
const transcriptBox = document.getElementById("transcript-box");
const transcriptText = document.getElementById("transcript-text");
const responseBox = document.getElementById("response-box");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    statusText.textContent = "Voice recognition isn't supported in this browser. Try Chrome.";
    micBtn.disabled = true;
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;

    micBtn.addEventListener("click", () => {
        responseBox.classList.add("d-none");
        transcriptBox.classList.add("d-none");
        statusText.textContent = "Listening...";
        micBtn.disabled = true;
        recognition.start();
    });

    recognition.onresult = async (event) => {
        const spokenText = event.results[0][0].transcript;
        transcriptText.textContent = spokenText;
        transcriptBox.classList.remove("d-none");
        statusText.textContent = "Thinking...";

        try {
            // Uses the SAME chat endpoint as the text chat widget --
            // one booking brain, two input methods (typing or speaking).
            const resp = await fetch("{% url 'chat_api' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                body: JSON.stringify({ message: spokenText }),
            });

            if (!resp.ok) {
                throw new Error(`Server returned ${resp.status}`);
            }

            const data = await resp.json();
            const replyText = data.response || data.error || "Sorry, something went wrong.";

            responseBox.classList.remove("d-none");
            responseBox.className = data.error ? "alert alert-danger text-start" : "alert alert-success text-start";
            responseBox.textContent = replyText;

            // Speak the response back (Text-to-Speech)
            const utterance = new SpeechSynthesisUtterance(replyText);
            utterance.lang = "en-IN";
            speechSynthesis.speak(utterance);

        } catch (err) {
            console.error("Voice booking error:", err);
            responseBox.classList.remove("d-none");
            responseBox.className = "alert alert-danger text-start";
            responseBox.textContent = "Sorry, connection error. Please try again.";
        } finally {
            statusText.textContent = "Tap to speak";
            micBtn.disabled = false;
        }
    };

    recognition.onerror = () => {
        statusText.textContent = "Didn't catch that. Tap to try again.";
        micBtn.disabled = false;
    };

    recognition.onend = () => {
        micBtn.disabled = false;
    };
}
</script>

{% endblock %}
