{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h3>{% if appointment %}Edit Appointment{% else %}Book an Appointment{% endif %}</h3>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}

    {% if not appointment %}
    <div class="mb-3">
      <label class="form-label">Doctor</label>
      <select name="doctor" class="form-select" required>
        <option value="">-- Select Doctor --</option>
        {% for d in doctors %}
          <option value="{{ d.id }}">
            Dr. {{ d.user.get_full_name|default:d.user.username }} - {{ d.specialization }} (₹{{ d.consultation_fee }})
          </option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label">Date</label>
      <input type="date" name="appointment_date" class="form-control"
             value="{{ appointment.appointment_date|date:'Y-m-d' }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Time</label>
      <input type="time" name="appointment_time" class="form-control"
             value="{{ appointment.appointment_time|time:'H:i' }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Reason for visit</label>
      <textarea name="reason" class="form-control" rows="3" required>{{ appointment.reason|default:"" }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      {% if appointment %}Update{% else %}Book Appointment{% endif %}
    </button>
    <a href="{% url 'appointment_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
