{% extends "base.html" %}
{% block title %}Cancel Appointment{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                <h4 class="mt-3">Cancel this appointment?</h4>
                <p class="text-muted">Dr. {{ appointment.doctor.user.get_full_name }} on {{ appointment.appointment_date }}</p>
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Cancel</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Go Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
