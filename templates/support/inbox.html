{% extends "base.html" %}
{% block title %}Support Inbox{% endblock %}
{% block content %}

<h3><i class="bi bi-inbox"></i> Patient Support Messages</h3>

<div class="card shadow-sm mt-3">
    <div class="list-group list-group-flush">
        {% for patient in patients %}
        <a href="{% url 'support_conversation' patient.id %}" class="list-group-item list-group-item-action">
            {{ patient.get_full_name|default:patient.username }}
        </a>
        {% empty %}
        <div class="text-center text-muted py-4">No support messages yet.</div>
        {% endfor %}
    </div>
</div>

{% endblock %}
