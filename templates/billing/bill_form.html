{% extends "base.html" %}

{% block title %}Create Bill{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-receipt"></i> Create Bill</h4>
            </div>

            <div class="card-body">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Select Appointment</label>
                        {{ form.appointment }}
                    </div>

                    <div id="patient-info" class="alert alert-light border d-none mb-3">
                        <strong id="info-patient"></strong> — <span id="info-doctor"></span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Consultation Fee (auto-filled)</label>
                        {{ form.consultation_fee }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Additional Charges</label>
                        {{ form.additional_charges }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Discount</label>
                        {{ form.discount }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Payment Status</label>
                        {{ form.payment_status }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Payment Mode</label>
                        {{ form.payment_mode }}
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Generate Bill
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

<script>
document.getElementById("id_appointment").addEventListener("change", function () {
    const appointmentId = this.value;
    const infoBox = document.getElementById("patient-info");
    const feeInput = document.getElementById("id_consultation_fee");

    if (!appointmentId) {
        infoBox.classList.add("d-none");
        return;
    }

    fetch(`/api/appointment/${appointmentId}/fee/`)
        .then(response => response.json())
        .then(data => {
            feeInput.value = data.fee;
            document.getElementById("info-patient").textContent = data.patient_name;
            document.getElementById("info-doctor").textContent = data.doctor_name;
            infoBox.classList.remove("d-none");
        });
});
</script>

{% endblock %}
