{% extends "base.html" %}

{% block title %}
Doctor
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            {% if form.instance.pk %}
                <h3>Edit Doctor</h3>
            {% else %}
                <h3>Add Doctor</h3>
            {% endif %}
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Save
                </button>

                <a href="{% url 'doctor_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
