{% extends "base.html" %}

{% block title %}Add Doctor{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h3>Add Doctor</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Save
            </button>

            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                Cancel
            </a>
            {% if form.instance.pk %}
    <h3>Edit Doctor</h3>
{% else %}
    <h3>Add Doctor</h3>
{% endif %}

        </form>

    </div>

</div>

{% endblock %}
