{% if request.user.is_authenticated %}

<!-- 3D Floating Pulse Chat Button -->
<button id="chat-toggle-btn" class="btn btn-primary rounded-circle p-0 d-flex align-items-center justify-content-center shadow-3d-btn position-fixed glow-pulse-3d"
        style="bottom: 28px; right: 28px; width: 64px; height: 64px; z-index: 1080; background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%) !important; border: 2px solid rgba(255, 255, 255, 0.8) !important;">
    <i class="bi bi-chat-dots-fill fs-3 text-white" id="chat-toggle-icon"></i>
</button>

<!-- Dynamic 3D Glassmorphism Floating Chat Panel -->
<div id="chat-panel" class="card shadow-3d-panel border-0 d-none position-fixed fade-in-3d"
     style="bottom: 102px; right: 28px; width: 370px; max-width: 92vw; z-index: 1080; background: rgba(255, 255, 255, 0.92) !important; backdrop-filter: blur(20px); border-radius: 24px !important; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.9) !important;">

    <div class="card-header border-0 p-3 text-white d-flex justify-content-between align-items-center"
         style="background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #0891b2 100%) !important;">
        <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-white bg-opacity-20 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; backdrop-filter: blur(4px);">
                <i class="bi bi-robot fs-5 text-white"></i>
            </div>
            <div>
                <h6 class="fw-bold mb-0 text-white" style="font-size: 15px; font-family: 'Outfit', sans-serif;">
                    {% if request.user.role == "PATIENT" %}Clinic AI Assistant
                    {% elif request.user.role == "DOCTOR" %}Doctor Assistant
                    {% elif request.user.role == "ADMIN" %}Admin Assistant
                    {% else %}AI Assistant
                    {% endif %}
                </h6>
                <small class="text-white-50 d-block" style="font-size: 11px;"><i class="bi bi-circle-fill text-success me-1" style="font-size: 8px;"></i>Online</small>
            </div>
        </div>
        <button id="chat-close-btn" class="btn-close btn-close-white shadow-none" style="font-size: 0.8rem;"></button>
    </div>

    <div class="card-body p-3 d-flex flex-column gap-2" style="background: rgba(248, 250, 252, 0.6);">

        <div id="chat-log" class="custom-scroll" style="height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px;"></div>

        <div id="status-text" class="badge bg-primary bg-opacity-10 text-primary small align-self-start fw-normal px-2 py-1 rounded-pill d-none">
            <i class="bi bi-three-dots loading-dots me-1"></i> Thinking...
        </div>

        <div class="input-group mt-1 bg-white p-1 rounded-pill border shadow-sm">
            <!-- mic button remove பண்ணுங்க, input group-ல text field + send button மட்டும் -->
<div class="input-group mt-1 bg-white p-1 rounded-pill border shadow-sm">
    <input type="text" id="chat-input" class="form-control border-0 bg-transparent shadow-none px-2 text-dark" placeholder="Ask AI assistant...">
    <button class="btn btn-primary rounded-circle border-0 p-0 d-flex align-items-center justify-content-center me-1" id="send-btn" style="width: 36px; height: 36px;">
        <i class="bi bi-send-fill text-white small"></i>
    </button>
</div>
          

    </div>
</div>

<style>
.shadow-3d-btn {
    box-shadow: 0 12px 25px -5px rgba(37, 99, 235, 0.45), inset 0 2px 2px rgba(255, 255, 255, 0.5) !important;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
}
.shadow-3d-btn:hover { transform: scale(1.08) translateY(-3px); }

.shadow-3d-panel {
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.9) !important;
}

.glow-pulse-3d::after {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    top: 0; left: 0;
    border-radius: 50%;
    background: rgba(37, 99, 235, 0.4);
    z-index: -1;
    animation: pulseGlow3D 2.5s infinite;
}

@keyframes pulseGlow3D {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.45); opacity: 0; }
}

.chat-bubble-user {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
    color: #ffffff !important;
    padding: 10px 14px;
    border-radius: 18px 18px 2px 18px;
    max-width: 82%;
    align-self: flex-end;
    font-size: 0.88rem;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.22);
    word-break: break-word;
}

.chat-bubble-bot {
    background: #ffffff !important;
    color: #0f172a !important;
    padding: 10px 14px;
    border-radius: 18px 18px 18px 2px;
    max-width: 82%;
    align-self: flex-start;
    font-size: 0.88rem;
    border: 1px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    word-break: break-word;
}

.chat-bubble-escalated {
    background: #fef2f2 !important;
    border: 1px solid #fca5a5 !important;
    color: #991b1b !important;
}

#mic-btn.listening {
    background: #ef4444 !important;
    color: #ffffff !important;
    animation: micPulse 1s infinite;
}

@keyframes micPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
}

.fade-in-3d {
    animation: slideUp3DPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp3DPop {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.custom-scroll::-webkit-scrollbar { width: 5px; }
.custom-scroll::-webkit-scrollbar-track { background: transparent; }
.custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
.custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>

<script>
(function () {
    const toggleBtn = document.getElementById('chat-toggle-btn');
    const closeBtn = document.getElementById('chat-close-btn');
    const panel = document.getElementById('chat-panel');
    const toggleIcon = document.getElementById('chat-toggle-icon');
    let greeted = false;

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }

    function appendBubble(text, sender, escalated = false) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        let cls = sender === 'user' ? 'chat-bubble-user' : 'chat-bubble-bot';
        if (escalated) cls += ' chat-bubble-escalated';
        div.className = cls;
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    toggleBtn.addEventListener('click', () => {
        const isHidden = panel.classList.contains('d-none');
        panel.classList.toggle('d-none');
        toggleIcon.className = isHidden ? 'bi bi-x-lg fs-3' : 'bi bi-chat-dots-fill fs-3';

        if (isHidden && !greeted) {
            appendBubble("Hi! How can I help you today?", 'bot');
            greeted = true;
        }
    });

    closeBtn.addEventListener('click', () => {
        panel.classList.add('d-none');
        toggleIcon.className = 'bi bi-chat-dots-fill fs-3';
    });

    async function sendMessage(text) {
        const message = text.trim();
        if (!message) return;

        appendBubble(message, 'user');
        document.getElementById('chat-input').value = '';

        const statusText = document.getElementById('status-text');
        statusText.classList.remove('d-none');
        statusText.innerHTML = '<i class="bi bi-three-dots loading-dots me-1"></i> Thinking...';

        try {
            const resp = await fetch("{% url 'chat_api' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ message: message }),
            });
            const data = await resp.json();
            const replyText = data.response || data.error || "Sorry, something went wrong.";

            appendBubble(replyText, 'bot', !!data.error);
            statusText.classList.add('d-none');

            const utterance = new SpeechSynthesisUtterance(replyText);
            speechSynthesis.speak(utterance);

        } catch (err) {
            statusText.classList.add('d-none');
            appendBubble("Sorry, connection error. Please try again.", 'bot', true);
        }
    }

    document.getElementById('send-btn').addEventListener('click', () => {
        sendMessage(document.getElementById('chat-input').value);
    });

    document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage(document.getElementById('chat-input').value);
    });

    const micBtn = document.getElementById('mic-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        micBtn.disabled = true;
        micBtn.title = "Voice not supported (try Chrome)";
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = "en-IN";
        recognition.interimResults = false;

        micBtn.addEventListener('click', () => {
            micBtn.classList.add('listening');
            const statusText = document.getElementById('status-text');
            statusText.classList.remove('d-none');
            statusText.innerHTML = '<i class="bi bi-record-circle me-1 text-danger"></i> Listening...';
            recognition.start();
        });

        recognition.onresult = (event) => {
            micBtn.classList.remove('listening');
            sendMessage(event.results[0][0].transcript);
        };

        recognition.onerror = () => {
            micBtn.classList.remove('listening');
            document.getElementById('status-text').classList.add('d-none');
        };

        recognition.onend = () => micBtn.classList.remove('listening');
    }
})();
</script>

{% endif %}
