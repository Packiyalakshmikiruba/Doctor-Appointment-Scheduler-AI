{% load static %}
<link rel="stylesheet" href="{% static 'css/components/search_modal.css' %}">
<!-- ===========================
      GLOBAL SEARCH MODAL (Pro Redesigned)
=========================== -->

<div class="modal fade"
     id="globalSearchModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden bg-white">

            <!-- Modal Header -->
            <div class="modal-header border-bottom border-light px-4 py-3 bg-light bg-opacity-50">
                <div class="d-flex align-items-center gap-2">
                    <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                        <i class="fas fa-search fs-6"></i>
                    </div>
                    <h5 class="modal-title fw-bold text-dark mb-0">Global Portal Search</h5>
                </div>
                <button class="btn-close shadow-none bg-white rounded-circle p-2" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">

                <!-- Search Box with Glow & Focus Effect -->
                <div class="search-input-wrapper position-relative mb-4">
                    <div class="input-group input-group-lg border rounded-4 shadow-sm overflow-hidden bg-white search-group-focus">
                        <span class="input-group-text bg-white border-0 ps-4 text-primary">
                            <i class="fas fa-search fs-5"></i>
                        </span>
                        <input
                            type="text"
                            id="globalSearchInput"
                            class="form-control border-0 shadow-none py-3 fs-6 text-dark fw-medium"
                            placeholder="Type to search Patients, Doctors, Bills, Appointments..."
                            autocomplete="off">
                        <span class="input-group-text bg-white border-0 pe-4 text-muted fs-8">
                            <kbd class="bg-light text-secondary border px-2 py-1 rounded-2 shadow-sm">ESC</kbd>
                        </span>
                    </div>
                </div>

                <!-- Quick Access Section Header -->
                <div class="d-flex align-items-center justify-content-between mb-3 px-1">
                    <h6 class="text-uppercase fw-bold text-muted fs-8 tracking-wider mb-0">
                        <i class="fas fa-bolt text-warning me-1"></i> Quick Shortcuts
                    </h6>
                    <span class="text-muted fs-8">Frequently visited</span>
                </div>

                <!-- Quick Access Grid -->
                <div class="row g-3">

                    <div class="col-md-4 col-6">
                        <a href="{% url 'patient_list' %}" class="search-card-pro card border-0 rounded-4 p-3 text-decoration-none h-100 bg-light bg-opacity-50 transition-all hover-card">
                            <div class="d-flex align-items-center gap-3">
                                <div class="search-icon-box bg-primary bg-opacity-10 text-primary rounded-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; min-width: 44px;">
                                    <i class="fas fa-user-injured fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark fs-7">Patients</h6>
                                    <small class="text-muted fs-8">View records</small>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-4 col-6">
                        <a href="{% url 'doctor_list' %}" class="search-card-pro card border-0 rounded-4 p-3 text-decoration-none h-100 bg-light bg-opacity-50 transition-all hover-card">
                            <div class="d-flex align-items-center gap-3">
                                <div class="search-icon-box bg-success bg-opacity-10 text-success rounded-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; min-width: 44px;">
                                    <i class="fas fa-user-md fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark fs-7">Doctors</h6>
                                    <small class="text-muted fs-8">Medical staff</small>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-4 col-6">
                        <a href="{% url 'appointment_list' %}" class="search-card-pro card border-0 rounded-4 p-3 text-decoration-none h-100 bg-light bg-opacity-50 transition-all hover-card">
                            <div class="d-flex align-items-center gap-3">
                                <div class="search-icon-box bg-warning bg-opacity-10 text-warning rounded-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; min-width: 44px;">
                                    <i class="fas fa-calendar-check fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark fs-7">Appointments</h6>
                                    <small class="text-muted fs-8">Schedules</small>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-4 col-6">
                        <a href="{% url 'medical_record_list' %}" class="search-card-pro card border-0 rounded-4 p-3 text-decoration-none h-100 bg-light bg-opacity-50 transition-all hover-card">
                            <div class="d-flex align-items-center gap-3">
                                <div class="search-icon-box bg-info bg-opacity-10 text-info rounded-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; min-width: 44px;">
                                    <i class="fas fa-notes-medical fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark fs-7">Medical Records</h6>
                                    <small class="text-muted fs-8">Case histories</small>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-4 col-6">
                        <a href="{% url 'bill_list' %}" class="search-card-pro card border-0 rounded-4 p-3 text-decoration-none h-100 bg-light bg-opacity-50 transition-all hover-card">
                            <div class="d-flex align-items-center gap-3">
                                <div class="search-icon-box bg-danger bg-opacity-10 text-danger rounded-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; min-width: 44px;">
                                    <i class="fas fa-file-invoice-dollar fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark fs-7">Bills</h6>
                                    <small class="text-muted fs-8">Invoices</small>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-4 col-6">
                        <a href="{% url 'bill_list' %}" class="search-card-pro card border-0 rounded-4 p-3 text-decoration-none h-100 bg-light bg-opacity-50 transition-all hover-card">
                            <div class="d-flex align-items-center gap-3">
                                <div class="search-icon-box bg-secondary bg-opacity-10 text-secondary rounded-3 d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; min-width: 44px;">
                                    <i class="fas fa-credit-card fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-bold text-dark fs-7">Payments</h6>
                                    <small class="text-muted fs-8">Transactions</small>
                                </div>
                            </div>
                        </a>
                    </div>

                </div>

                <!-- Live Search Results Container -->
                <div id="searchResults" class="mt-4">
                    <!-- Dynamic live search results load here -->
                </div>

            </div>

        </div>

    </div>

</div>

<!-- CSS Styling for Search Modal Animation & Focus -->
<style>
    .search-group-focus:focus-within {
        border-color: #0d6efd !important;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15) !important;
        background-color: #fff !important;
    }
    .transition-all {
        transition: all 0.25s ease-in-out;
    }
    .hover-card:hover {
        transform: translateY(-3px);
        background-color: #ffffff !important;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.06) !important;
        border: 1px solid rgba(13, 110, 253, 0.15) !important;
    }
    .hover-card:hover .search-icon-box {
        transform: scale(1.1);
        transition: transform 0.2s ease-in-out;
    }
</style>
