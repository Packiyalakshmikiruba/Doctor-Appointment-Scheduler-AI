<tbody>

{% for record in records %}

<tr>


<td>
{{record.id}}
</td>



<td>

{{record.appointment.patient.user.get_full_name}}

</td>



<td>

Dr.
{{record.appointment.doctor.user.get_full_name}}

</td>



<td>

{{record.diagnosis|truncatewords:8}}

</td>



<td>

{{record.prescriptions.count}}

</td>



<td>

{{record.created_at|date:"d M Y"}}

</td>


<td>


<a href="{% url 'medical_record_detail' record.id %}"
class="btn btn-sm btn-primary">

View

</a>


</td>


</tr>


{% empty %}


<tr>

<td colspan="7">

No Records

</td>

</tr>


{% endfor %}


</tbody>
